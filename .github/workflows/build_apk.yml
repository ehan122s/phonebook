name: Build Android Release APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Release APK
        working-directory: frontend
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee ../build_output.txt

      - name: Report Build Output on Failure
        if: failure()
        run: |
          if [ -f build_output.txt ]; then
            grep -E "FAILURE:|What went wrong:|Execution failed|caused by|Caused by:" -A 8 build_output.txt | head -n 35 | while IFS= read -r line; do
              echo "::error title=BuildFailure::$line"
            done
          fi

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
