<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}.leaflet-control-attribution{font-size:9px}</style></head>
<body><div id="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{scrollWheelZoom:false}).setView([-7.22,107.9],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
let marker; const params=new URLSearchParams(location.search); const lat=Number(params.get('lat')), lng=Number(params.get('lng'));
fetch('geojson/garut.geojson').then(r=>r.json()).then(data=>{const layer=L.geoJSON(data,{style:{color:'#2E7D32',weight:1,fillColor:'#66BB6A',fillOpacity:.15},onEachFeature:(f,l)=>l.bindTooltip(f.properties.KECAMATAN||'Garut')}).addTo(map);map.fitBounds(layer.getBounds());if(Number.isFinite(lat)&&Number.isFinite(lng)){marker=L.marker([lat,lng]).addTo(map).bindPopup('Lokasi kegiatan').openPopup();map.setView([lat,lng],14)}});
map.on('click',e=>parent.postMessage({type:'sipenyuluh-location',lat:e.latlng.lat,lng:e.latlng.lng},'*'));
</script></body></html>
